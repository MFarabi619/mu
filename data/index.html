<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
  <meta charset="utf-8">
  <title>mu</title>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-6 space-y-6">

  <h1 class="text-3xl font-bold mb-6">ESP32 Control Panel</h1>

  <!-- LED CARD -->
  <div class="card bg-base-200 shadow-xl p-6 max-w-sm">
    <div class="text-sm opacity-70 mb-2">LED State</div>
    <div id="state-display" class="font-mono text-2xl mb-4">OFF</div>
    <button id="toggle-btn" class="btn btn-primary w-full">Turn ON</button>
  </div>

  <!-- SERVO CARD -->
  <div class="card bg-base-200 shadow-xl p-6 max-w-sm">
    <div class="text-sm opacity-70 mb-2">Servo Control</div>
    <div class="flex flex-wrap gap-2">
      <button class="btn btn-sm" data-endpoint="/servo/left">Left</button>
      <button class="btn btn-sm" data-endpoint="/servo/center">Center</button>
      <button class="btn btn-sm" data-endpoint="/servo/right">Right</button>
      <button class="btn btn-sm" data-endpoint="/servo/sweep">Sweep</button>
      <button class="btn btn-sm" data-endpoint="/servo/stop">Stop</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById("toggle-btn");
    const stateEl = document.getElementById("state-display");

    let isOn = false;
    let busy = false;

    // LED control
    btn.addEventListener("click", async () => {
      if (busy) return;
      busy = true;

      const endpoint = isOn ? "/off" : "/on";

      try {
        await fetch(endpoint);
        isOn = !isOn;
        stateEl.textContent = isOn ? "ON" : "OFF";
        btn.textContent = isOn ? "Turn OFF" : "Turn ON";
      } catch (err) {
        console.error("toggle fail", err);
      }

      busy = false;
    });

    // Servo control
    document.querySelectorAll("[data-endpoint]").forEach((b) => {
      b.addEventListener("click", async () => {
        b.disabled = true;
        try {
          await fetch(b.dataset.endpoint);
        } catch (e) {
          console.error("servo error", e);
        }
        b.disabled = false;
      });
    });
  </script>

</body>
</html>
